[project]
name = "webstudio"
version = "1.6.0"
description = ""
authors = [
    { name = "Marks Polakovs", email = "marks.polakovs@ury.org.uk" },
    { name = "Matthew Stratford", email = "matthew.stratford@ury.org.uk" },
]
readme = "README.md"

requires-python = ">=3.9.2"
dependencies = [
    "aiohttp>=3.11.18",
    "av>=14.0.0",
    "jack-client>=0.5.4",
    "websockets>=15.0",
    "aiortc>=1.12.0",
    "sentry-sdk>=1.16.0",
    "requests>=2.28.2",
    "flask>=2.2.3",
    "flask-cors>=3.0.10",
    "telnetlib3>=5.0.1",
    "twilio>=9.11.1",
]

[dependency-groups]
dev = [
    "black>=23.1.0",
    "mypy>=1.1.1",
    "types-jack-client>=0.5.10.7",
    "types-requests>=2.28.11.15",
]

[tool.mypy]
strict = true
disallow_any_explicit = true
